<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Ecolaço</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/admin/login_adm.css">
</head>

<body>

    <div class="grao"></div>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                <img src="../../imagens/marca/logo.png" alt="Ecolaço">
                <span class="badge-admin">ADMIN</span>
            </div>

            <h1>Área Administrativa</h1>

            <p>
                Acesse o painel de administração do Ecolaço para gerenciar
                prefeituras e aprovar dados.
            </p>

            <form id="formLoginAdmin">

                <div class="form-campo">

                    <label for="email">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="admin@ecolaco.com"
                        value="admin@ecolaco.com"
                        required
                    >

                </div>

                <div class="form-campo">

                    <label for="senha">
                        <i class="fas fa-key"></i> Senha
                    </label>

                    <div class="senha-wrapper">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            value="admin123"
                            required
                        >

                        <button
                            type="button"
                            class="btn-mostrar-senha"
                            onclick="mostrarSenha('senha')"
                        >

                            <i class="fas fa-eye"></i>

                        </button>

                    </div>

                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>

            </form>

            <div id="mensagem" class="mensagem"></div>

            <a href="../index.html" class="voltar">
                <i class="fas fa-arrow-left"></i> Voltar ao site
            </a>

        </div>

    </div>

    <script src="../../js/admin/login_adm.js"></script>

</body>

</html>
